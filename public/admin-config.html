<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><title>系统配置</title>
<link rel="stylesheet" href="css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="css/custom-theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/admin-ui.css">
</head>
</head>
<body>
<div class="page" id="page" style="display:none">
  <div class="page-head">
    <h1>系统配置</h1>
    <p>管理密码配置、Chunk 切分、提问模�?/p>
  </div>

  <div id="notice"></div>

  <div class="config-tabs">
    <button class="tab-btn active" data-tab="password">密码配置</button>
    <button class="tab-btn" data-tab="chunking">Chunk 切分</button>
    <button class="tab-btn" data-tab="prompt-templates">提问模板</button>
  </div>

  <!-- 密码配置 -->
  <div id="password" class="tab-content active">
    <div class="card">
      <h3>密码配置</h3>
      <p class="card-sub">为临时用户配置访问密码规�?/p>
      <form id="pwdForm" style="display:grid;gap:12px;max-width:600px">
        <div class="form-group">
          <label>
            <input type="checkbox" id="pwd_enabled"> 启用密码认证
          </label>
        </div>
        <div class="form-group">
          <label>默认过期时间（分钟）</label>
          <input type="number" id="pwd_default_expire" min="1" max="10080" value="120">
        </div>
        <div class="form-group">
          <label>最大过期时间（分钟�?/label>
          <input type="number" id="pwd_max_expire" min="1" max="10080" value="1440">
        </div>
        <div class="form-group">
          <label>密码复杂�?/label>
          <select id="pwd_complexity">
            <option value="simple">简单（仅数字）</option>
            <option value="medium" selected>中等（字�?数字�?/option>
            <option value="complex">复杂（字�?数字+特殊字符�?/option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" onclick="savePwdConfig()">保存配置</button>
      </form>

      <div style="margin-top:32px">
        <h4>生成临时密码</h4>
        <div style="display:grid;gap:12px;max-width:600px">
          <div class="form-group">
            <label>密码</label>
            <input type="text" id="temp_pwd_value" placeholder="如：ABC123">
          </div>
          <div class="form-group">
            <label>过期时间（分钟）</label>
            <input type="number" id="temp_pwd_expire" min="1" value="120">
          </div>
          <button type="button" class="btn btn-secondary" onclick="generateTempPwd()">生成</button>
        </div>
      </div>

      <div style="margin-top:32px" id="tempPwdList"></div>
    </div>
  </div>

  <!-- Chunk 切分配置 -->
  <div id="chunking" class="tab-content">
    <div class="card">
      <h3>Chunk 切分配置</h3>
      <p class="card-sub">配置文档如何被切分成知识片段</p>
      <form id="chunkForm" style="display:grid;gap:12px;max-width:600px">
        <div class="form-group">
          <label>切分策略</label>
          <select id="chunk_strategy">
            <option value="section" selected>按章�?/option>
            <option value="paragraph">按段�?/option>
            <option value="fixed">固定大小</option>
          </select>
        </div>
        <div class="form-group">
          <label>最大字�?/label>
          <input type="number" id="chunk_max_tokens" min="100" max="2000" value="600">
        </div>
        <div class="form-group">
          <label>重叠字数</label>
          <input type="number" id="chunk_overlap" min="0" max="500" value="50">
        </div>
        <div class="form-group">
          <label>标题层级</label>
          <input type="number" id="chunk_header_level" min="1" max="6" value="3">
        </div>
        <button type="button" class="btn btn-primary" onclick="saveChunkConfig()">保存配置</button>
      </form>
    </div>
  </div>

  <!-- 提问模板 -->
  <div id="prompt-templates" class="tab-content">
    <div class="card">
      <h3>提问模板管理</h3>
      <p class="card-sub">�?AI 聊天配置快速提问模板，最�?10 条。可配置适用角色（全�?产品/测试/前端/客服�?/p>
      <div style="margin-bottom:16px;display:flex;gap:12px;align-items:center">
        <button class="btn btn-primary" onclick="showAddPromptTemplate()">新增模板</button>
        <span class="muted" id="ptCount">已用 0 / 10 �?/span>
      </div>

      <div id="addPtForm" style="display:none;margin-bottom:16px;padding:12px;background:var(--bg-secondary);border-radius:4px">
        <h4 id="ptFormTitle">新增提问模板</h4>
        <form style="display:grid;gap:12px;max-width:600px">
          <div class="form-group">
            <label>模板名称</label>
            <input type="text" id="pt_name" placeholder="如：编写产品需求文�?>
          </div>
          <div class="form-group">
            <label>模板内容</label>
            <textarea id="pt_content" placeholder="输入 AI 快速提问的内容" style="min-height:120px"></textarea>
          </div>
          <div class="form-group">
            <label>适用角色</label>
            <select id="pt_role">
              <option value="all">全部</option>
              <option value="product">产品</option>
              <option value="test">测试</option>
              <option value="frontend">前端</option>
              <option value="cs">客服</option>
            </select>
          </div>
          <div class="form-group">
            <label>优先级（数字越小越靠前）</label>
            <input type="number" id="pt_priority" min="1" max="100" value="1">
          </div>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-primary" onclick="savePromptTemplate()">保存</button>
            <button type="button" class="btn btn-secondary" onclick="hideAddPromptTemplate()">取消</button>
          </div>
        </form>
      </div>

      <div id="ptList" class="table-container">加载中�?/div>
    </div>
  </div>
</div>

<script src="js/vendor/bootstrap.bundle.min.js"></script>
<script src="js/vendor/sweetalert2.all.min.js"></script>
<script src="js/vendor/dompurify.min.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script>
if (App.guard()) {
  App.renderSidebar('admin', 'config');
  document.getElementById('page').style.display = 'block';

  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tabName = btn.getAttribute('data-tab');
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabName).classList.add('active');
    });
  });

  function showNotice(msg, type = 'success') {
    const notice = document.getElementById('notice');
    notice.innerHTML = `<div class="notice ${type}">${msg}</div>`;
    setTimeout(() => { notice.innerHTML = ''; }, 3000);
  }

  // ===== 密码配置 =====
  function loadPwdConfig() {
    App.api('/api/admin/password-config').then(d => {
      const c = d.config;
      document.getElementById('pwd_enabled').checked = c.enabled;
      document.getElementById('pwd_default_expire').value = c.default_expire_minutes;
      document.getElementById('pwd_max_expire').value = c.max_expire_minutes;
      document.getElementById('pwd_complexity').value = c.complexity;
    });
    loadTempPasswords();
  }

  function savePwdConfig() {
    const data = {
      enabled: document.getElementById('pwd_enabled').checked,
      default_expire_minutes: parseInt(document.getElementById('pwd_default_expire').value),
      max_expire_minutes: parseInt(document.getElementById('pwd_max_expire').value),
      complexity: document.getElementById('pwd_complexity').value,
    };
    App.api('/api/admin/password-config', { method: 'PUT', body: data }).then(() => {
      showNotice('密码配置已保�?);
      loadPwdConfig();
    }).catch(err => showNotice('保存失败�? + err.message, 'error'));
  }

  function generateTempPwd() {
    const data = {
      password: document.getElementById('temp_pwd_value').value,
      expiryMinutes: parseInt(document.getElementById('temp_pwd_expire').value),
    };
    if (!data.password) {
      showNotice('请输入密�?, 'error');
      return;
    }
    App.api('/api/admin/temp-passwords', { method: 'POST', body: data }).then(() => {
      showNotice('临时密码已生�?);
      document.getElementById('temp_pwd_value').value = '';
      loadTempPasswords();
    }).catch(err => showNotice('生成失败�? + err.message, 'error'));
  }

  function loadTempPasswords() {
    App.api('/api/admin/temp-passwords').then(d => {
      const pwds = d.tempPasswords || [];
      const html = `<h4 style="margin-top:20px">已生成的临时密码</h4>
        <table class="tbl">
          <tr><th>密码</th><th>生成时间</th><th>过期时间</th><th>状�?/th></tr>
          ${pwds.map(p => {
            const now = new Date();
            const expireAt = new Date(p.expire_at);
            const isExpired = expireAt < now;
            const status = isExpired ? '已过�? : p.used ? '已使�? : '有效';
            const statusClass = isExpired ? 'danger' : p.used ? 'warning' : 'success';
            return `<tr>
              <td><code>${p.password}</code></td>
              <td>${p.created_at.split('T')[0]}</td>
              <td>${p.expire_at.split('T')[0]}</td>
              <td><span class="badge badge-${statusClass}">${status}</span></td>
            </tr>`;
          }).join('')}
        </table>`;
      document.getElementById('tempPwdList').innerHTML = html;
    }).catch(() => {
      document.getElementById('tempPwdList').innerHTML = '<div class="muted">暂无临时密码</div>';
    });
  }

  // ===== Chunk 切分配置 =====
  function loadChunkConfig() {
    App.api('/api/admin/chunking-config').then(d => {
      const c = d.config;
      document.getElementById('chunk_strategy').value = c.strategy;
      document.getElementById('chunk_max_tokens').value = c.max_tokens;
      document.getElementById('chunk_overlap').value = c.overlap_tokens;
      document.getElementById('chunk_header_level').value = c.header_level;
    });
  }

  function saveChunkConfig() {
    const data = {
      strategy: document.getElementById('chunk_strategy').value,
      max_tokens: parseInt(document.getElementById('chunk_max_tokens').value),
      overlap_tokens: parseInt(document.getElementById('chunk_overlap').value),
      header_level: parseInt(document.getElementById('chunk_header_level').value),
    };
    App.api('/api/admin/chunking-config', { method: 'PUT', body: data }).then(() => {
      showNotice('Chunk 配置已保�?);
      loadChunkConfig();
    }).catch(err => showNotice('保存失败�? + err.message, 'error'));
  }

  // ===== 提问模板 CRUD =====
  // 全局暂存编辑中的模板 id（null = 新增�?
  let editingPtId = null;

  function showAddPromptTemplate() {
    editingPtId = null;
    document.getElementById('ptFormTitle').textContent = '新增提问模板';
    document.getElementById('pt_name').value = '';
    document.getElementById('pt_content').value = '';
    document.getElementById('pt_role').value = 'all';
    document.getElementById('pt_priority').value = '1';
    document.getElementById('addPtForm').style.display = 'block';
  }

  function hideAddPromptTemplate() {
    document.getElementById('addPtForm').style.display = 'none';
  }

  function editPromptTemplate(tpl) {
    editingPtId = tpl.id;
    document.getElementById('ptFormTitle').textContent = '编辑提问模板';
    document.getElementById('pt_name').value = tpl.name || '';
    document.getElementById('pt_content').value = tpl.content || '';
    document.getElementById('pt_role').value = tpl.role || 'all';
    document.getElementById('pt_priority').value = tpl.priority || 1;
    document.getElementById('addPtForm').style.display = 'block';
  }

  function savePromptTemplate() {
    const name = document.getElementById('pt_name').value.trim();
    const content = document.getElementById('pt_content').value.trim();
    const role = document.getElementById('pt_role').value;
    const priority = parseInt(document.getElementById('pt_priority').value, 10) || 1;

    if (!name) { showNotice('请输入模板名�?, 'error'); return; }
    if (!content) { showNotice('请输入模板内�?, 'error'); return; }

    const url = editingPtId ? `/api/admin/prompt-templates/${editingPtId}` : '/api/admin/prompt-templates';
    const method = editingPtId ? 'PUT' : 'POST';
    const body = { name, content, role, priority };

    App.api(url, { method, body }).then(() => {
      showNotice(editingPtId ? '模板已更�? : '模板已新�?);
      hideAddPromptTemplate();
      loadPromptTemplates();
    }).catch(err => showNotice('保存失败�? + err.message, 'error'));
  }

  async function deletePromptTemplate(id) {
    if (!(await App.confirm('确定删除此提问模板？'))) return;
    App.api('/api/admin/prompt-templates/' + id, { method: 'DELETE' }).then(() => {
      showNotice('模板已删�?);
      if (editingPtId === id) hideAddPromptTemplate();
      loadPromptTemplates();
    }).catch(err => showNotice('删除失败�? + err.message, 'error'));
  }

  async function togglePromptTemplate(tpl) {
    const body = { enabled: !tpl.enabled };
    App.api('/api/admin/prompt-templates/' + tpl.id, { method: 'PUT', body }).then(() => {
      showNotice(tpl.enabled ? '模板已停�? : '模板已启�?);
      loadPromptTemplates();
    }).catch(err => showNotice('操作失败�? + err.message, 'error'));
  }

  const ROLE_LABELS = { all: '全部', product: '产品', test: '测试', frontend: '前端', cs: '客服' };

  function loadPromptTemplates() {
    App.api('/api/admin/prompt-templates?all=1').then(d => {
      const templates = d.templates || [];
      document.getElementById('ptCount').textContent = `已用 ${templates.length} / 10 条`;
      if (templates.length === 0) {
        document.getElementById('ptList').innerHTML = '<div class="muted">暂无模板，点�?新增模板"开始配�?/div>';
        return;
      }
      const html = `<table class="tbl">
        <tr><th>名称</th><th>内容</th><th>适用角色</th><th>优先�?/th><th>状�?/th><th>操作</th></tr>
        ${templates.map(t => {
          const roleLabel = ROLE_LABELS[t.role] || t.role || '全部';
          const statusHtml = t.enabled
            ? '<span class="badge badge-success">启用</span>'
            : '<span class="badge badge-warning">停用</span>';
          return `<tr>
            <td style="min-width:130px">${t.name || '-'}</td>
            <td style="max-width:300px"><code style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(t.content || '').substring(0, 60)}</code></td>
            <td>${roleLabel}</td>
            <td>${t.priority || 1}</td>
            <td>${statusHtml}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm btn-secondary" onclick="editPromptTemplate(${JSON.stringify(t).replace(/"/g, '&quot;')})">编辑</button>
              <button class="btn btn-sm btn-secondary" onclick="togglePromptTemplate(${JSON.stringify(t).replace(/"/g, '&quot;')})">${t.enabled ? '停用' : '启用'}</button>
              <button class="btn btn-sm btn-danger" onclick="deletePromptTemplate('${t.id}')">删除</button>
            </td>
          </tr>`;
        }).join('')}
      </table>`;
      document.getElementById('ptList').innerHTML = html;
    }).catch(() => {
      document.getElementById('ptList').innerHTML = '<div class="muted">加载失败</div>';
    });
  }

  // 初始化（分层提示词与系统参数 Tab 已在 K3 移除，Prompt 配置移入能力中心 K4 维护�?
  loadPwdConfig();
  loadChunkConfig();
  loadPromptTemplates();
}
</script>
</body>
</html>
