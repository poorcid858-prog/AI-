<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><title>系统配置</title>
<link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/css/custom-theme.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  .config-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .config-tabs button { padding: 8px 16px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .config-tabs button.active { color: var(--text); border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-secondary); color: var(--text); }
  .form-group textarea { resize: vertical; min-height: 100px; }
  .btn { padding: 8px 16px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-sm { padding: 6px 12px; font-size: 0.9em; }
  .table-container { overflow-x: auto; margin-top: 16px; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th, .tbl td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .tbl th { background: var(--bg-secondary); font-weight: 500; }
  .tbl tr:hover { background: var(--bg-secondary); }
  .success { color: var(--success); }
  .warning { color: var(--warning); }
  .danger { color: var(--danger); }
  .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; }
  .badge-success { background: rgba(76, 175, 80, 0.2); color: var(--success); }
  .badge-warning { background: rgba(255, 152, 0, 0.2); color: var(--warning); }
  .badge-danger { background: rgba(244, 67, 54, 0.2); color: var(--danger); }
  .notice { padding: 12px; border-radius: 4px; margin-bottom: 16px; }
  .notice.success { background: rgba(76, 175, 80, 0.1); border-left: 3px solid var(--success); color: var(--success); }
  .notice.error { background: rgba(244, 67, 54, 0.1); border-left: 3px solid var(--danger); color: var(--danger); }
</style>
</head>
<body>
<div class="page" id="page" style="display:none">
  <div class="page-head">
    <h1>系统配置</h1>
    <p>管理密码配置、Chunk 切分、分层提示词、系统参数等</p>
  </div>

  <div id="notice"></div>

  <div class="config-tabs">
    <button class="tab-btn active" data-tab="password">密码配置</button>
    <button class="tab-btn" data-tab="chunking">Chunk 切分</button>
    <button class="tab-btn" data-tab="prompts">分层提示词</button>
    <button class="tab-btn" data-tab="system">系统参数</button>
  </div>

  <!-- 密码配置 -->
  <div id="password" class="tab-content active">
    <div class="card">
      <h3>密码配置</h3>
      <p class="card-sub">为临时用户配置访问密码规则</p>
      <form id="pwdForm" style="display:grid;gap:12px;max-width:600px">
        <div class="form-group">
          <label>
            <input type="checkbox" id="pwd_enabled"> 启用密码认证
          </label>
        </div>
        <div class="form-group">
          <label>默认过期时间（分钟）</label>
          <input type="number" id="pwd_default_expire" min="1" max="10080" value="120">
        </div>
        <div class="form-group">
          <label>最大过期时间（分钟）</label>
          <input type="number" id="pwd_max_expire" min="1" max="10080" value="1440">
        </div>
        <div class="form-group">
          <label>密码复杂度</label>
          <select id="pwd_complexity">
            <option value="simple">简单（仅数字）</option>
            <option value="medium" selected>中等（字母+数字）</option>
            <option value="complex">复杂（字母+数字+特殊字符）</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" onclick="savePwdConfig()">保存配置</button>
      </form>

      <div style="margin-top:32px">
        <h4>生成临时密码</h4>
        <div style="display:grid;gap:12px;max-width:600px">
          <div class="form-group">
            <label>密码</label>
            <input type="text" id="temp_pwd_value" placeholder="如：ABC123">
          </div>
          <div class="form-group">
            <label>过期时间（分钟）</label>
            <input type="number" id="temp_pwd_expire" min="1" value="120">
          </div>
          <button type="button" class="btn btn-secondary" onclick="generateTempPwd()">生成</button>
        </div>
      </div>

      <div style="margin-top:32px" id="tempPwdList"></div>
    </div>
  </div>

  <!-- Chunk 切分配置 -->
  <div id="chunking" class="tab-content">
    <div class="card">
      <h3>Chunk 切分配置</h3>
      <p class="card-sub">配置文档如何被切分成知识片段</p>
      <form id="chunkForm" style="display:grid;gap:12px;max-width:600px">
        <div class="form-group">
          <label>切分策略</label>
          <select id="chunk_strategy">
            <option value="section" selected>按章节</option>
            <option value="paragraph">按段落</option>
            <option value="fixed">固定大小</option>
          </select>
        </div>
        <div class="form-group">
          <label>最大字数</label>
          <input type="number" id="chunk_max_tokens" min="100" max="2000" value="600">
        </div>
        <div class="form-group">
          <label>重叠字数</label>
          <input type="number" id="chunk_overlap" min="0" max="500" value="50">
        </div>
        <div class="form-group">
          <label>标题层级</label>
          <input type="number" id="chunk_header_level" min="1" max="6" value="3">
        </div>
        <button type="button" class="btn btn-primary" onclick="saveChunkConfig()">保存配置</button>
      </form>
    </div>
  </div>

  <!-- 分层提示词 -->
  <div id="prompts" class="tab-content">
    <div class="card">
      <h3>分层提示词配置</h3>
      <p class="card-sub">为不同角色和业务线配置不同的提示词</p>
      <div style="margin-bottom:16px">
        <button class="btn btn-primary" onclick="showAddPromptForm()">添加新配置</button>
      </div>

      <div id="addPromptForm" style="display:none;margin-bottom:16px;padding:12px;background:var(--bg-secondary);border-radius:4px">
        <h4>新增分层提示词</h4>
        <form style="display:grid;gap:12px;max-width:600px">
          <div class="form-group">
            <label>层级</label>
            <input type="text" id="prompt_level" placeholder="如：basic、advanced">
          </div>
          <div class="form-group">
            <label>角色名称</label>
            <input type="text" id="prompt_role" placeholder="如：客服、产品经理">
          </div>
          <div class="form-group">
            <label>业务线</label>
            <input type="text" id="prompt_bizline" placeholder="如：交易线、会员线">
          </div>
          <div class="form-group">
            <label>提示词内容</label>
            <textarea id="prompt_text" placeholder="输入提示词内容"></textarea>
          </div>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-secondary" onclick="savePromptLayer()">保存</button>
            <button type="button" class="btn btn-secondary" onclick="hideAddPromptForm()">取消</button>
          </div>
        </form>
      </div>

      <div id="promptList" class="table-container">加载中…</div>
    </div>
  </div>

  <!-- 系统参数 -->
  <div id="system" class="tab-content">
    <div class="card">
      <h3>系统参数配置</h3>
      <p class="card-sub">通用系统参数</p>
      <div style="margin-bottom:16px">
        <button class="btn btn-primary" onclick="showAddSysConfigForm()">添加新参数</button>
      </div>

      <div id="addSysConfigForm" style="display:none;margin-bottom:16px;padding:12px;background:var(--bg-secondary);border-radius:4px">
        <h4>新增系统参数</h4>
        <form style="display:grid;gap:12px;max-width:600px">
          <div class="form-group">
            <label>参数名</label>
            <input type="text" id="syscfg_key" placeholder="如：max_file_size">
          </div>
          <div class="form-group">
            <label>参数值</label>
            <input type="text" id="syscfg_value" placeholder="输入值">
          </div>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn btn-secondary" onclick="saveSysConfig()">保存</button>
            <button type="button" class="btn btn-secondary" onclick="hideAddSysConfigForm()">取消</button>
          </div>
        </form>
      </div>

      <div id="sysConfigList" class="table-container">加载中…</div>
    </div>
  </div>
</div>

<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="/js/vendor/sweetalert2.all.min.js"></script>
<script src="/js/vendor/dompurify.min.js"></script>
<script src="/js/app.js"></script>
<script>
if (App.guard()) {
  App.renderHeader('admin');
  document.getElementById('page').style.display = 'block';

  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tabName = btn.getAttribute('data-tab');
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabName).classList.add('active');
    });
  });

  function showNotice(msg, type = 'success') {
    const notice = document.getElementById('notice');
    notice.innerHTML = `<div class="notice ${type}">${msg}</div>`;
    setTimeout(() => { notice.innerHTML = ''; }, 3000);
  }

  // ===== 密码配置 =====
  function loadPwdConfig() {
    App.api('/api/admin/password-config').then(d => {
      const c = d.config;
      document.getElementById('pwd_enabled').checked = c.enabled;
      document.getElementById('pwd_default_expire').value = c.default_expire_minutes;
      document.getElementById('pwd_max_expire').value = c.max_expire_minutes;
      document.getElementById('pwd_complexity').value = c.complexity;
    });
    loadTempPasswords();
  }

  function savePwdConfig() {
    const data = {
      enabled: document.getElementById('pwd_enabled').checked,
      default_expire_minutes: parseInt(document.getElementById('pwd_default_expire').value),
      max_expire_minutes: parseInt(document.getElementById('pwd_max_expire').value),
      complexity: document.getElementById('pwd_complexity').value,
    };
    App.api('/api/admin/password-config', { method: 'PUT', body: data }).then(() => {
      showNotice('密码配置已保存');
      loadPwdConfig();
    }).catch(err => showNotice('保存失败：' + err.message, 'error'));
  }

  function generateTempPwd() {
    const data = {
      password: document.getElementById('temp_pwd_value').value,
      expiryMinutes: parseInt(document.getElementById('temp_pwd_expire').value),
    };
    if (!data.password) {
      showNotice('请输入密码', 'error');
      return;
    }
    App.api('/api/admin/temp-passwords', { method: 'POST', body: data }).then(() => {
      showNotice('临时密码已生成');
      document.getElementById('temp_pwd_value').value = '';
      loadTempPasswords();
    }).catch(err => showNotice('生成失败：' + err.message, 'error'));
  }

  function loadTempPasswords() {
    App.api('/api/admin/temp-passwords').then(d => {
      const pwds = d.tempPasswords || [];
      const html = `<h4 style="margin-top:20px">已生成的临时密码</h4>
        <table class="tbl">
          <tr><th>密码</th><th>生成时间</th><th>过期时间</th><th>状态</th></tr>
          ${pwds.map(p => {
            const now = new Date();
            const expireAt = new Date(p.expire_at);
            const isExpired = expireAt < now;
            const status = isExpired ? '已过期' : p.used ? '已使用' : '有效';
            const statusClass = isExpired ? 'danger' : p.used ? 'warning' : 'success';
            return `<tr>
              <td><code>${p.password}</code></td>
              <td>${p.created_at.split('T')[0]}</td>
              <td>${p.expire_at.split('T')[0]}</td>
              <td><span class="badge badge-${statusClass}">${status}</span></td>
            </tr>`;
          }).join('')}
        </table>`;
      document.getElementById('tempPwdList').innerHTML = html;
    }).catch(() => {
      document.getElementById('tempPwdList').innerHTML = '<div class="muted">暂无临时密码</div>';
    });
  }

  // ===== Chunk 切分配置 =====
  function loadChunkConfig() {
    App.api('/api/admin/chunking-config').then(d => {
      const c = d.config;
      document.getElementById('chunk_strategy').value = c.strategy;
      document.getElementById('chunk_max_tokens').value = c.max_tokens;
      document.getElementById('chunk_overlap').value = c.overlap_tokens;
      document.getElementById('chunk_header_level').value = c.header_level;
    });
  }

  function saveChunkConfig() {
    const data = {
      strategy: document.getElementById('chunk_strategy').value,
      max_tokens: parseInt(document.getElementById('chunk_max_tokens').value),
      overlap_tokens: parseInt(document.getElementById('chunk_overlap').value),
      header_level: parseInt(document.getElementById('chunk_header_level').value),
    };
    App.api('/api/admin/chunking-config', { method: 'PUT', body: data }).then(() => {
      showNotice('Chunk 配置已保存');
      loadChunkConfig();
    }).catch(err => showNotice('保存失败：' + err.message, 'error'));
  }

  // ===== 分层提示词 =====
  function showAddPromptForm() {
    document.getElementById('addPromptForm').style.display = 'block';
  }

  function hideAddPromptForm() {
    document.getElementById('addPromptForm').style.display = 'none';
    document.getElementById('prompt_level').value = '';
    document.getElementById('prompt_role').value = '';
    document.getElementById('prompt_bizline').value = '';
    document.getElementById('prompt_text').value = '';
  }

  function savePromptLayer() {
    const data = {
      level: document.getElementById('prompt_level').value,
      role_name: document.getElementById('prompt_role').value,
      business_line: document.getElementById('prompt_bizline').value,
      prompt_text: document.getElementById('prompt_text').value,
    };
    if (!data.level || !data.role_name || !data.prompt_text) {
      showNotice('请填写所有必填项', 'error');
      return;
    }
    App.api('/api/admin/prompt-layers', { method: 'POST', body: data }).then(() => {
      showNotice('分层提示词已保存');
      hideAddPromptForm();
      loadPromptLayers();
    }).catch(err => showNotice('保存失败：' + err.message, 'error'));
  }

  async function deletePromptLayer(id) {
    if (!(await App.confirm('确定删除此配置？'))) return;
    App.api('/api/admin/prompt-layers/' + id, { method: 'DELETE' }).then(() => {
      showNotice('配置已删除');
      loadPromptLayers();
    }).catch(err => showNotice('删除失败：' + err.message, 'error'));
  }

  function loadPromptLayers() {
    App.api('/api/admin/prompt-layers').then(d => {
      const layers = d.layers || [];
      if (layers.length === 0) {
        document.getElementById('promptList').innerHTML = '<div class="muted">暂无配置</div>';
        return;
      }
      const html = `<table class="tbl">
        <tr><th>层级</th><th>角色</th><th>业务线</th><th>提示词</th><th>操作</th></tr>
        ${layers.map(l => `<tr>
          <td>${l.level}</td>
          <td>${l.role_name}</td>
          <td>${l.business_line || '-'}</td>
          <td><code style="max-width:200px;overflow:hidden;text-overflow:ellipsis;display:block">${l.prompt_text.substring(0, 50)}</code></td>
          <td><button class="btn btn-sm btn-danger" onclick="deletePromptLayer(${l.id})">删除</button></td>
        </tr>`).join('')}
      </table>`;
      document.getElementById('promptList').innerHTML = html;
    }).catch(() => {
      document.getElementById('promptList').innerHTML = '<div class="muted">加载失败</div>';
    });
  }

  // ===== 系统参数 =====
  function showAddSysConfigForm() {
    document.getElementById('addSysConfigForm').style.display = 'block';
  }

  function hideAddSysConfigForm() {
    document.getElementById('addSysConfigForm').style.display = 'none';
    document.getElementById('syscfg_key').value = '';
    document.getElementById('syscfg_value').value = '';
  }

  function saveSysConfig() {
    const key = document.getElementById('syscfg_key').value;
    const value = document.getElementById('syscfg_value').value;
    if (!key || !value) {
      showNotice('请填写参数名和参数值', 'error');
      return;
    }
    App.api('/api/admin/system-config/' + key, { method: 'PUT', body: { value } }).then(() => {
      showNotice('系统参数已保存');
      hideAddSysConfigForm();
      loadSysConfigs();
    }).catch(err => showNotice('保存失败：' + err.message, 'error'));
  }

  async function deleteSysConfig(key) {
    if (!(await App.confirm('确定删除此参数？'))) return;
    App.api('/api/admin/system-config/' + key, { method: 'DELETE' }).then(() => {
      showNotice('参数已删除');
      loadSysConfigs();
    }).catch(err => showNotice('删除失败：' + err.message, 'error'));
  }

  function loadSysConfigs() {
    App.api('/api/admin/system-config').then(d => {
      const configs = d.configs || [];
      if (configs.length === 0) {
        document.getElementById('sysConfigList').innerHTML = '<div class="muted">暂无参数</div>';
        return;
      }
      const html = `<table class="tbl">
        <tr><th>参数名</th><th>参数值</th><th>更新时间</th><th>操作</th></tr>
        ${configs.map(c => `<tr>
          <td><code>${c.key}</code></td>
          <td>${c.value}</td>
          <td>${c.updatedAt ? c.updatedAt.split('T')[0] : '-'}</td>
          <td><button class="btn btn-sm btn-danger" onclick="deleteSysConfig('${c.key}')">删除</button></td>
        </tr>`).join('')}
      </table>`;
      document.getElementById('sysConfigList').innerHTML = html;
    }).catch(() => {
      document.getElementById('sysConfigList').innerHTML = '<div class="muted">加载失败</div>';
    });
  }

  // 初始化
  loadPwdConfig();
  loadChunkConfig();
  loadPromptLayers();
  loadSysConfigs();
}
</script>
</body>
</html>
