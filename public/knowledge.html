<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库 - 四层管理</title>
  <link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/css/custom-theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/knowledge.css">
</head>
<body>
  <div class="page-container">
    <div class="page-head">
      <h1>知识库管理</h1>
      <p class="subtitle">原始文档 → 标准化文档 → Chunk → 向量化数据</p>
    </div>

    <main class="knowledge-container">
      <!-- 上传文档区域（仅 admin） -->
      <div id="uploadArea" class="card" style="margin-bottom:16px;padding:16px;display:none">
        <h3 style="margin-bottom:8px">上传新文档</h3>
        <p class="card-sub" style="margin-bottom:12px">上传后立即进入待审核状态。审核通过后知识片段正式进入 RAG 库。</p>
        <form id="uploadForm" style="display:grid;gap:12px;max-width:760px">
          <div><label>文档标题</label><input id="uploadTitle" placeholder="如：售后政策 v1.0" style="width:100%;padding:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;color:var(--text)"></div>
          <div><label>Markdown 内容</label>
            <textarea id="uploadContent" rows="8" placeholder="输入文档内容..." style="width:100%;padding:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:monospace;font-size:12px"></textarea>
          </div>
          <div class="grid grid-3" style="gap:10px;display:grid;grid-template-columns:1fr 1fr 1fr">
            <div><label>业务线</label>
              <select id="uploadBizLine" style="width:100%;padding:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;color:var(--text)">
                <option value="trade">交易线</option>
                <option value="membership">会员线</option>
                <option value="all">全业务线</option>
              </select>
            </div>
            <div><label>安全分级</label>
              <select id="uploadSec" style="width:100%;padding:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;color:var(--text)">
                <option value="public">public 对外</option>
                <option value="internal" selected>internal 内部</option>
                <option value="confidential">confidential 机密</option>
                <option value="secret">secret 绝密</option>
              </select>
            </div>
            <div><label>标签（逗号分隔）</label><input id="uploadTags" placeholder="退款,售后" style="width:100%;padding:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;color:var(--text)"></div>
          </div>
          <div><button class="btn btn-primary" style="background:var(--accent);color:#fff" id="uploadBtn">上传并预处理</button></div>
        </form>
      </div>
      <!-- 追踪面包屑 -->
      <div id="breadcrumb" class="breadcrumb" style="display: none;">
        <span>追踪路径：</span>
        <span id="breadcrumb-content"></span>
      </div>

      <!-- 标签页导航 -->
      <nav class="tabs" role="tablist">
        <button class="tab-btn active" data-layer="documents" role="tab" aria-selected="true">
          原始文档
        </button>
        <button class="tab-btn" data-layer="standardized" role="tab" aria-selected="false">
          标准化文档
        </button>
        <button class="tab-btn" data-layer="chunks" role="tab" aria-selected="false">
          Chunk
        </button>
        <button class="tab-btn" data-layer="embeddings" role="tab" aria-selected="false">
          向量化数据
        </button>
      </nav>

      <!-- 搜索和筛选控制区 -->
      <div class="controls">
        <input
          type="text"
          id="search"
          class="search-input"
          placeholder="搜索关键词..."
          aria-label="搜索"
        >
        <button id="btn-search" class="btn btn-primary" title="搜索">
          🔍 搜索
        </button>
        <button id="btn-clear" class="btn btn-secondary" title="清空">
          ✕ 清空
        </button>
      </div>

      <!-- 数据列表容器 -->
      <div id="content-area" class="content-area" role="tabpanel">
        <div class="loading" id="loading" style="display: none;">
          <span class="spinner"></span>
          <p>加载中...</p>
        </div>
        <div class="empty-state" id="empty-state" style="display: none;">
          <p>📭 暂无数据</p>
        </div>
        <div id="table-container"></div>
      </div>

      <!-- 分页容器 -->
      <div id="pagination" class="pagination" style="display: none;"></div>

      <!-- 详情弹窗 -->
      <div id="detail-modal" class="modal" role="dialog" aria-labelledby="modal-title">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="modal-title">详情</h2>
            <button class="modal-close" aria-label="关闭">&times;</button>
          </div>
          <div id="detail-content" class="modal-body"></div>
        </div>
      </div>

      <!-- 追踪链路弹窗 -->
      <div id="trace-modal" class="modal" role="dialog" aria-labelledby="trace-title">
        <div class="modal-content modal-large">
          <div class="modal-header">
            <h2 id="trace-title">追踪链路</h2>
            <button class="modal-close" aria-label="关闭">&times;</button>
          </div>
          <div id="trace-content" class="modal-body"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/knowledge.js"></script>
  <script>
  // 管理员在上传区显示
  if (App.user && (App.user.role === 'admin' || App.user.role === 'reviewer') && !App.user.readonly) {
    document.getElementById('uploadArea').style.display = 'block';
  }

  // 上传表单提交
  document.getElementById('uploadForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true; btn.textContent = '预处理中…';
    try {
      const body = {
        title: document.getElementById('uploadTitle').value,
        fileName: (document.getElementById('uploadTitle').value || 'new-doc') + '.md',
        content: document.getElementById('uploadContent').value,
        bizLine: document.getElementById('uploadBizLine').value,
        securityLevel: document.getElementById('uploadSec').value,
        tags: document.getElementById('uploadTags').value.split(',').map((x) => x.trim()).filter(Boolean),
      };
      const d = await App.api('/api/documents/upload', { method: 'POST', body: JSON.stringify(body) });
      App.toast('已上传并预处理：' + (d.document.chunkCount || 0) + ' 个切片，等待审核', 'success');
      document.getElementById('uploadContent').value = '';
      document.getElementById('uploadTitle').value = '';
      // 刷新文档列表
      if (window.dataLoader) window.dataLoader.load('documents');
    } catch (e) {
      App.toast(e.message || '上传失败', 'error');
    } finally {
      btn.disabled = false; btn.textContent = '上传并预处理';
    }
  });
  </script>
</body>
</html>
