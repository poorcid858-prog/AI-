<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识中心 - 四层管理</title>
  <link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/css/custom-theme.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/admin-ui.css">
  <link rel="stylesheet" href="/css/knowledge.css">
</head>
<body>
  <div class="page-container">
    <div class="page-head">
      <h1>知识中心</h1>
      <p class="subtitle">原始文档 → 标准化文档 → Chunk → 向量化数据</p>
    </div>

    <main class="knowledge-container">
      <!-- 上传文档区域（仅 admin/reviewer） -->
      <div id="uploadArea" class="cap-group-card" style="margin-bottom:16px;display:none">
        <div class="cap-group-head"><span class="cap-group-title">📤 上传新文档</span></div>
        <div class="card-body" style="padding:16px">
          <p class="card-sub" style="margin-bottom:12px">上传后立即进入待审核状态。审核通过后点击"生成向量数据"开始知识处理。</p>
          <form id="uploadForm" style="display:grid;gap:12px;max-width:760px">
            <div><label class="form-label fw-500" style="margin-bottom:5px">文档标题</label><input id="uploadTitle" class="form-control" placeholder="如：售后政策 v1.0"></div>
            <div><label class="form-label fw-500" style="margin-bottom:5px">选择文件 (.md, .txt)</label>
              <input type="file" id="uploadFile" accept=".md,.txt" class="form-control" style="padding:8px">
              <div class="text-muted small" style="margin-top:4px">选择文件后，内容将自动填入下方编辑框。支持 .md 和 .txt 格式。</div>
            </div>
            <div><label class="form-label fw-500" style="margin-bottom:5px">Markdown 内容</label>
              <textarea id="uploadContent" class="form-control" rows="8" placeholder="选文件后自动填入，也可手动编辑..." style="font-family:monospace;font-size:12px"></textarea>
            </div>
            <div class="grid grid-3" style="gap:10px;display:grid;grid-template-columns:1fr 1fr 1fr">
              <div><label class="form-label fw-500" style="margin-bottom:5px">业务线</label>
                <select id="uploadBizLine" class="form-select">
                  <option value="trade">交易线</option>
                  <option value="membership">会员线</option>
                  <option value="all">全业务线</option>
                </select>
              </div>
              <div><label class="form-label fw-500" style="margin-bottom:5px">安全分级</label>
                <select id="uploadSec" class="form-select">
                  <option value="public">public 对外</option>
                  <option value="internal" selected>internal 内部</option>
                  <option value="confidential">confidential 机密</option>
                  <option value="secret">secret 绝密</option>
                </select>
              </div>
              <div><label class="form-label fw-500" style="margin-bottom:5px">标签（逗号分隔）</label><input id="uploadTags" class="form-control" placeholder="退款,售后"></div>
            </div>
            <div><button class="btn btn-primary" id="uploadBtn">上传并预处理</button></div>
          </form>
        </div>
      </div>

      <!-- 追踪面包屑 -->
      <div id="breadcrumb" class="breadcrumb" style="display: none;">
        <span>追踪路径：</span>
        <span id="breadcrumb-content"></span>
      </div>

      <!-- 批量操作栏 -->
      <div id="batchActions" class="batch-actions" style="display: none;">
        <span class="batch-count">已选择 <strong id="selectedCount">0</strong> 项</span>
        <button class="btn btn-primary" id="batchGenerate" style="display:none">批量生成向量数据</button>
        <button class="btn btn-success" id="batchOnline" style="display:none">批量上线</button>
        <button class="btn btn-warning" id="batchOffline" style="display:none">批量下线</button>
        <button class="btn btn-secondary" id="clearSelection">取消选择</button>
      </div>

      <!-- 标签页导航 -->
      <nav class="tabs" role="tablist">
        <button class="tab-btn active" data-layer="documents" role="tab" aria-selected="true">
          原始文档
        </button>
        <button class="tab-btn" data-layer="standardized" role="tab" aria-selected="false">
          标准化文档
        </button>
        <button class="tab-btn" data-layer="chunks" role="tab" aria-selected="false">
          Chunk
        </button>
        <button class="tab-btn" data-layer="vectors" role="tab" aria-selected="false">
          向量化数据
        </button>
      </nav>

      <!-- 搜索和筛选控制区 -->
      <div class="controls">
        <input
          type="text"
          id="search"
          class="search-input"
          placeholder="搜索关键词..."
          aria-label="搜索"
        >
        <button id="btn-search" class="btn btn-primary" title="搜索">
          🔍 搜索
        </button>
        <button id="btn-clear" class="btn btn-secondary" title="清空">
          ✕ 清空
        </button>
      </div>

      <!-- 数据列表容器 -->
      <div id="content-area" class="content-area" role="tabpanel">
        <div class="loading" id="loading" style="display: none;">
          <span class="spinner"></span>
          <p>加载中...</p>
        </div>
        <div class="empty-state" id="empty-state" style="display: none;">
          <p>📭 暂无数据</p>
        </div>
        <div id="table-container"></div>
      </div>

      <!-- 分页容器 -->
      <div id="pagination" class="pagination" style="display: none;"></div>

      <!-- 详情弹窗 -->
      <div id="detail-modal" class="modal" role="dialog" aria-labelledby="modal-title">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="modal-title">详情</h2>
            <button class="modal-close" aria-label="关闭">&times;</button>
          </div>
          <div id="detail-content" class="modal-body"></div>
        </div>
      </div>

      <!-- 追踪链路弹窗 -->
      <div id="trace-modal" class="modal" role="dialog" aria-labelledby="trace-title">
        <div class="modal-content modal-large">
          <div class="modal-header">
            <h2 id="trace-title">追踪链路</h2>
            <button class="modal-close" aria-label="关闭">&times;</button>
          </div>
          <div id="trace-content" class="modal-body"></div>
        </div>
      </div>

      <!-- 进度弹窗 -->
      <div id="progress-modal" class="modal" role="dialog" aria-labelledby="progress-title">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="progress-title">处理进度</h2>
            <button class="modal-close" aria-label="关闭">&times;</button>
          </div>
          <div id="progress-content" class="modal-body">
            <div class="progress-container">
              <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
              </div>
              <div class="progress-text" id="progressText">0%</div>
            </div>
            <div class="phase-list" id="phaseList"></div>
            <div class="progress-error" id="progressError" style="display:none"></div>
            <div class="progress-actions" id="progressActions" style="display:none">
              <button class="btn btn-primary" id="retryBtn">重新处理</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/vendor/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/knowledge.js"></script>
  <script>
  if (App.guard()) App.renderSidebar('knowledge', 'kb');
  // 管理员在上传区显示
  if (App.user && (App.user.role === 'admin' || App.user.role === 'reviewer') && !App.user.readonly) {
    document.getElementById('uploadArea').style.display = 'block';
  }

  // 上传表单提交
  document.getElementById('uploadFile').addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    // 若标题为空，用文件名（去扩展名）当标题
    const titleInput = document.getElementById('uploadTitle');
    if (!titleInput.value.trim()) {
      titleInput.value = file.name.replace(/\.[^.]+$/, '');
    }
    // 用 FileReader 读 .md/.txt 文本
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('uploadContent').value = e.target.result || '';
      App.toast('已读取文件内容，可检查或直接上传', 'success');
    };
    reader.onerror = () => App.toast('文件读取失败，请重试', 'error');
    reader.readAsText(file, 'utf-8');
  });

  document.getElementById('uploadForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!document.getElementById('uploadContent').value.trim()) {
      App.toast('请先选择文件或填写内容', 'error');
      return;
    }
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true; btn.textContent = '预处理中…';
    try {
      const body = {
        title: document.getElementById('uploadTitle').value,
        fileName: (document.getElementById('uploadFile').files[0]?.name) || (document.getElementById('uploadTitle').value || 'new-doc') + '.md',
        content: document.getElementById('uploadContent').value,
        bizLine: document.getElementById('uploadBizLine').value,
        securityLevel: document.getElementById('uploadSec').value,
        tags: document.getElementById('uploadTags').value.split(',').map((x) => x.trim()).filter(Boolean),
      };
      const d = await App.api('/api/documents/upload', { method: 'POST', body: JSON.stringify(body) });
      App.toast('已上传并预处理：' + (d.document.chunkCount || 0) + ' 个切片，等待审核', 'success');
      document.getElementById('uploadContent').value = '';
      document.getElementById('uploadTitle').value = '';
      document.getElementById('uploadFile').value = '';
      // 刷新文档列表
      if (window.dataLoader) window.dataLoader.load('documents');
    } catch (e) {
      App.toast(e.message || '上传失败', 'error');
    } finally {
      btn.disabled = false; btn.textContent = '上传并预处理';
    }
  });
  </script>
</body>
</html>
