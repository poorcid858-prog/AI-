<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><title>模型配置</title>
<link rel="stylesheet" href="css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="css/custom-theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sidebar.css">
<style>
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th, .tbl td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .tbl th { background: var(--bg-panel-2); font-weight: 500; color: var(--text-dim); font-size: 12px; }
  .tbl tr:hover td { background: var(--bg-panel-2); }
  .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; }
  .modal.active { display: flex; }
  .modal-content { background: var(--bg-panel); padding: 24px; border-radius: 8px; width: 90%; max-width: 520px; border: 1px solid var(--border); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--text-dim); }
  .form-group input, .form-group select { width: 100%; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .badge-on { color: var(--success); }
  .badge-off { color: var(--danger); }
</style>
</head>
<body>
<div class="page" id="page" style="display:none">
  <div class="page-head">
    <h1>模型配置</h1>
    <p>管理 AI 模型名称、类型、API 地址、密钥、参�?/p>
  </div>

  <div id="notice"></div>

  <div style="margin-bottom:16px">
    <button class="btn btn-primary" onclick="openAddModal()">+ 新增模型</button>
  </div>

  <div style="overflow-x:auto">
    <table class="tbl">
      <thead>
        <tr>
          <th>名称</th>
          <th>类型</th>
          <th>API 地址</th>
          <th>Temperature</th>
          <th>Token 上限</th>
          <th>状�?/th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="modelList"></tbody>
    </table>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal" id="modelModal">
  <div class="modal-content">
    <h3 id="modalTitle">新增模型</h3>
    <form id="modelForm">
      <div class="form-group">
        <label>模型名称 *</label>
        <input type="text" id="m_name" placeholder="如：doubao-pro-32k">
      </div>
      <div class="form-group">
        <label>类型</label>
        <select id="m_type">
          <option value="text">文本</option>
          <option value="image">图像</option>
          <option value="embedding">向量</option>
        </select>
      </div>
      <div class="form-group">
        <label>API 地址</label>
        <input type="text" id="m_apiUrl" placeholder="https://api.example.com/v1">
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="m_apiKey" placeholder="sk-...">
      </div>
      <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label>Temperature</label>
          <input type="number" id="m_temperature" step="0.1" min="0" max="2" value="0.3">
        </div>
        <div>
          <label>Token 上限</label>
          <input type="number" id="m_maxTokens" min="1" max="128000" value="4096">
        </div>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="m_enabled" checked> 启用</label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script>
if (App.guard()) {
  App.renderSidebar('admin', 'model');
  document.getElementById('page').style.display = 'block';

  let editingId = null;

  function showNotice(msg, type) {
    const el = document.getElementById('notice');
    el.innerHTML = `<div class="notice ${type}">${msg}</div>`;
    setTimeout(() => el.innerHTML = '', 3000);
  }

  function loadModels() {
    App.api('/api/admin/models').then(d => {
      const models = d.models || [];
      const tbody = document.getElementById('modelList');
      if (models.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-dim)">暂无模型配置</td></tr>';
        return;
      }
      tbody.innerHTML = models.map(m => `
        <tr>
          <td><strong>${App.esc(m.name)}</strong></td>
          <td>${m.type || 'text'}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;font-size:12px">${App.esc(m.apiUrl || '-')}</td>
          <td>${m.temperature || 0.3}</td>
          <td class="mono">${m.maxTokens || 4096}</td>
          <td><span class="badge ${m.enabled ? 'badge-on' : 'badge-off'}">${m.enabled ? '启用' : '禁用'}</span></td>
          <td>
            <button class="btn btn-sm" onclick="editModel('${m.id}')">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteModel('${m.id}')">删除</button>
          </td>
        </tr>
      `).join('');
    }).catch(() => {
      document.getElementById('modelList').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-dim)">加载失败</td></tr>';
    });
  }

  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = '新增模型';
    document.getElementById('modelForm').reset();
    document.getElementById('m_enabled').checked = true;
    document.getElementById('modelModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modelModal').classList.remove('active');
  }

  function editModel(id) {
    App.api('/api/admin/models/' + id).then(d => {
      const m = d.model;
      editingId = m.id;
      document.getElementById('modalTitle').textContent = '编辑模型';
      document.getElementById('m_name').value = m.name || '';
      document.getElementById('m_type').value = m.type || 'text';
      document.getElementById('m_apiUrl').value = m.apiUrl || '';
      document.getElementById('m_apiKey').value = m.apiKey || '';
      document.getElementById('m_temperature').value = m.temperature || 0.3;
      document.getElementById('m_maxTokens').value = m.maxTokens || 4096;
      document.getElementById('m_enabled').checked = m.enabled !== false;
      document.getElementById('modelModal').classList.add('active');
    }).catch(err => showNotice('加载失败: ' + err.message, 'error'));
  }

  async function deleteModel(id) {
    if (!(await App.confirm('确认删除此模型配置？'))) return;
    App.api('/api/admin/models/' + id, { method: 'DELETE' }).then(() => {
      showNotice('模型已删�?);
      loadModels();
    }).catch(err => showNotice('删除失败: ' + err.message, 'error'));
  }

  document.getElementById('modelForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const data = {
      name: document.getElementById('m_name').value,
      type: document.getElementById('m_type').value,
      apiUrl: document.getElementById('m_apiUrl').value,
      apiKey: document.getElementById('m_apiKey').value,
      temperature: parseFloat(document.getElementById('m_temperature').value) || 0.3,
      maxTokens: parseInt(document.getElementById('m_maxTokens').value) || 4096,
      enabled: document.getElementById('m_enabled').checked,
    };
    if (!data.name) { showNotice('请输入模型名�?, 'error'); return; }

    const url = editingId
      ? '/api/admin/models/' + editingId
      : '/api/admin/models';
    const method = editingId ? 'PUT' : 'POST';

    App.api(url, { method, body: data }).then(() => {
      showNotice(editingId ? '模型已更�? : '模型已创�?);
      closeModal();
      loadModels();
    }).catch(err => showNotice('操作失败: ' + err.message, 'error'));
  });

  loadModels();
}
</script>
</body>
</html>
