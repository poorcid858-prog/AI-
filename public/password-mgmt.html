<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码管理</title>
  <link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/css/custom-theme.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
      color: #333;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 30px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .header h1 { font-size: 22px; margin-bottom: 6px; }
    .header p { font-size: 14px; opacity: 0.85; }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px 30px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .status-item {
      background: #f8f9ff;
      border-radius: 8px;
      padding: 16px;
    }

    .status-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 18px;
      font-weight: 600;
    }

    .status-value.ok { color: #52c41a; }
    .status-value.no { color: #ff4d4f; }

    .status-value .hint {
      font-size: 13px;
      font-weight: 400;
      color: #999;
      margin-left: 6px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102,126,234,0.15);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #5a6fd6;
    }

    .btn-danger {
      background: #ff4d4f;
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #e04345;
    }

    .btn-outline {
      background: white;
      color: #667eea;
      border: 1px solid #667eea;
    }

    .btn-outline:hover:not(:disabled) {
      background: #f0f2ff;
    }

    .btn-success {
      background: #52c41a;
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: #48b015;
    }

    .action-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    .msg.error {
      display: block;
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #cf1322;
    }

    .msg.success {
      display: block;
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #389e0d;
    }

    .msg.info {
      display: block;
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      color: #096dd9;
    }

    .suggest-box {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
    }

    .suggest-password {
      flex: 1;
      padding: 12px 16px;
      background: #f8f9ff;
      border: 1px dashed #d9d9d9;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      letter-spacing: 2px;
      text-align: center;
      color: #333;
      user-select: all;
    }

    .copied-tip {
      font-size: 12px;
      color: #52c41a;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .copied-tip.show { opacity: 1; }

    .nav-back {
      display: inline-block;
      margin-bottom: 16px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-back:hover { text-decoration: underline; }

    .loading-text {
      color: #999;
      font-size: 14px;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .status-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .suggest-box { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/dashboard.html" class="nav-back">&larr; 返回仪表盘</a>

    <div class="header">
      <h1>密码管理</h1>
      <p>管理系统的访问口令，所有修改需要管理员口令验证</p>
    </div>

    <!-- 状态卡片 -->
    <div class="card" id="statusCard">
      <div class="card-title">当前口令状态</div>
      <div class="status-grid" id="statusGrid">
        <div class="status-item">
          <div class="status-label">访问口令</div>
          <div class="status-value" id="accessStatus">--</div>
        </div>
        <div class="status-item">
          <div class="status-label">管理员口令</div>
          <div class="status-value" id="adminStatus">--</div>
        </div>
        <div class="status-item">
          <div class="status-label">口令长度</div>
          <div class="status-value" id="pwdLength">--</div>
        </div>
        <div class="status-item">
          <div class="status-label">上次修改</div>
          <div class="status-value" id="lastChanged">--</div>
        </div>
      </div>
    </div>

    <!-- 修改口令 -->
    <div class="card">
      <div class="card-title">修改访问口令</div>
      <div class="form-group">
        <label for="adminPassword">当前管理员口令</label>
        <input type="password" id="adminPassword" placeholder="输入当前管理员口令">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="newAdminPassword">新管理员口令</label>
          <input type="password" id="newAdminPassword" placeholder="输入新管理员口令">
        </div>
        <div class="form-group">
          <label for="newAccessPassword">新访问口令</label>
          <input type="password" id="newAccessPassword" placeholder="输入新访问口令">
        </div>
      </div>
      <div class="action-bar">
        <button class="btn btn-primary" id="changeBtn" onclick="changePassword()">修改口令</button>
      </div>
      <div class="msg" id="changeMsg"></div>
    </div>

    <!-- 重置口令 -->
    <div class="card">
      <div class="card-title">重置为默认口令</div>
      <p style="color:#888; font-size:14px; margin-bottom:12px;">
        将访问口令重置为默认口令 <code>demo123</code>。需要管理员口令验证。
      </p>
      <div class="form-group">
        <label for="resetAdminPassword">管理员口令</label>
        <input type="password" id="resetAdminPassword" placeholder="输入管理员口令">
      </div>
      <div class="action-bar">
        <button class="btn btn-danger" id="resetBtn" onclick="resetPassword()">重置为默认口令</button>
      </div>
      <div class="msg" id="resetMsg"></div>
    </div>

    <!-- 安全口令建议 -->
    <div class="card">
      <div class="card-title">安全口令生成工具</div>
      <p style="color:#888; font-size:14px; margin-bottom:12px;">
        生成包含大小写字母、数字和特殊字符的安全口令，长度 16 位。
      </p>
      <div class="suggest-box">
        <div class="suggest-password" id="suggestPwd">点击生成</div>
        <div class="action-bar">
          <button class="btn btn-outline" onclick="generateSuggest()">刷新生成</button>
          <button class="btn btn-success" onclick="copySuggest()">复制口令</button>
        </div>
      </div>
      <span class="copied-tip" id="copiedTip">已复制到剪贴板</span>
      <div class="msg" id="suggestMsg"></div>
    </div>
  </div>

  <script>
    // ========== API 基础路径 ==========
    const API = '/api/password-mgmt';

    // ========== 工具函数 ==========
    function showMsg(id, type, text) {
      const el = document.getElementById(id);
      el.className = 'msg ' + type;
      el.textContent = text;
      el.style.display = 'block';
    }

    function hideMsg(id) {
      const el = document.getElementById(id);
      el.style.display = 'none';
    }

    function setBtnLoading(id, loading, text) {
      const btn = document.getElementById(id);
      btn.disabled = loading;
      btn.textContent = loading ? '处理中...' : text;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '未知';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0') + ' ' +
        String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
    }

    // ========== 功能 1：加载口令状态 ==========
    async function loadStatus() {
      try {
        document.getElementById('statusGrid').innerHTML =
          '<div class="loading-text">加载中...</div>';

        const res = await fetch(API + '/status');
        const d = await res.json();

        if (!d.ok) {
          document.getElementById('statusGrid').innerHTML =
            '<div class="loading-text">加载失败：' + (d.error || '未知错误') + '</div>';
          return;
        }

        const s = d.data;
        document.getElementById('statusGrid').innerHTML = `
          <div class="status-item">
            <div class="status-label">访问口令</div>
            <div class="status-value ${s.hasAccessPassword ? 'ok' : 'no'}">
              ${s.hasAccessPassword ? '已设置' : '未设置'}
            </div>
          </div>
          <div class="status-item">
            <div class="status-label">管理员口令</div>
            <div class="status-value ${s.hasAdminPassword ? 'ok' : 'no'}">
              ${s.hasAdminPassword ? '已设置' : '未设置'}
            </div>
          </div>
          <div class="status-item">
            <div class="status-label">口令长度</div>
            <div class="status-value">
              ${s.accessPasswordLength || 0}
              <span class="hint">字符</span>
            </div>
          </div>
          <div class="status-item">
            <div class="status-label">上次修改</div>
            <div class="status-value" style="font-size:14px;">
              ${formatDate(s.lastChanged)}
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('statusGrid').innerHTML =
          '<div class="loading-text">加载失败：' + e.message + '</div>';
      }
    }

    // ========== 功能 2：修改口令 ==========
    async function changePassword() {
      hideMsg('changeMsg');

      const adminPassword = document.getElementById('adminPassword').value.trim();
      const newAdminPassword = document.getElementById('newAdminPassword').value.trim();
      const newAccessPassword = document.getElementById('newAccessPassword').value.trim();

      if (!adminPassword) {
        showMsg('changeMsg', 'error', '请输入当前管理员口令');
        return;
      }
      if (!newAdminPassword) {
        showMsg('changeMsg', 'error', '请输入新管理员口令');
        return;
      }
      if (!newAccessPassword) {
        showMsg('changeMsg', 'error', '请输入新访问口令');
        return;
      }

      setBtnLoading('changeBtn', true, '修改中...');

      try {
        const res = await fetch(API + '/change', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminPassword, newAdminPassword, newAccessPassword }),
        });

        const d = await res.json();

        if (!d.ok) {
          showMsg('changeMsg', 'error', d.error || '修改失败');
          return;
        }

        showMsg('changeMsg', 'success', '口令已更新');
        document.getElementById('adminPassword').value = '';
        document.getElementById('newAdminPassword').value = '';
        document.getElementById('newAccessPassword').value = '';
        loadStatus();
      } catch (e) {
        showMsg('changeMsg', 'error', '请求失败：' + e.message);
      } finally {
        setBtnLoading('changeBtn', false, '修改口令');
      }
    }

    // ========== 功能 3：重置口令 ==========
    async function resetPassword() {
      hideMsg('resetMsg');

      const adminPassword = document.getElementById('resetAdminPassword').value.trim();

      if (!adminPassword) {
        showMsg('resetMsg', 'error', '请输入管理员口令');
        return;
      }

      if (!(await App.confirm('确定要将访问口令重置为默认口令吗？'))) {
        return;
      }

      setBtnLoading('resetBtn', true, '重置中...');

      try {
        const res = await fetch(API + '/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminPassword }),
        });

        const d = await res.json();

        if (!d.ok) {
          showMsg('resetMsg', 'error', d.error || '重置失败');
          return;
        }

        showMsg('resetMsg', 'success', '已重置为默认口令：' + d.defaultPassword);
        document.getElementById('resetAdminPassword').value = '';
        loadStatus();
      } catch (e) {
        showMsg('resetMsg', 'error', '请求失败：' + e.message);
      } finally {
        setBtnLoading('resetBtn', false, '重置为默认口令');
      }
    }

    // ========== 功能 4：安全口令建议 ==========
    async function generateSuggest() {
      hideMsg('suggestMsg');

      const el = document.getElementById('suggestPwd');
      el.textContent = '生成中...';

      try {
        const res = await fetch(API + '/suggest');
        const d = await res.json();

        if (!d.ok) {
          el.textContent = '生成失败';
          showMsg('suggestMsg', 'error', d.error || '生成失败');
          return;
        }

        el.textContent = d.suggestedPassword;
        document.getElementById('copiedTip').classList.remove('show');
      } catch (e) {
        el.textContent = '生成失败';
        showMsg('suggestMsg', 'error', '请求失败：' + e.message);
      }
    }

    function copySuggest() {
      const pwd = document.getElementById('suggestPwd').textContent;
      if (!pwd || pwd === '点击生成' || pwd === '生成中...' || pwd === '生成失败') {
        showMsg('suggestMsg', 'info', '请先生成安全口令');
        return;
      }

      if (navigator.clipboard) {
        navigator.clipboard.writeText(pwd).then(() => {
          const tip = document.getElementById('copiedTip');
          tip.classList.add('show');
          setTimeout(() => tip.classList.remove('show'), 2000);
        }).catch(() => {
          fallbackCopy(pwd);
        });
      } else {
        fallbackCopy(pwd);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        const tip = document.getElementById('copiedTip');
        tip.classList.add('show');
        setTimeout(() => tip.classList.remove('show'), 2000);
      } catch (e) {
        showMsg('suggestMsg', 'error', '复制失败，请手动复制');
      }
      document.body.removeChild(ta);
    }

    // ========== 页面加载 ==========
    document.addEventListener('DOMContentLoaded', function() {
      loadStatus();
      generateSuggest();
    });
  </script>
  <script src="/js/vendor/bootstrap.bundle.min.js"></script>
</body>
</html>
