<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><title>AI 日志</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/custom-theme.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .log-table th, .log-table td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  .log-table th { color: var(--text-dim); font-weight: 500; font-size: 12px; background: var(--bg-panel-2); }
  .log-table tr:hover td { background: var(--bg-panel-2); }
  .badge-success { color: var(--success); }
  .badge-danger { color: var(--danger); }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { padding: 16px; border-radius: 8px; background: var(--bg-panel-2); border: 1px solid var(--border); }
  .stat-num { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
</style>
</head>
<body>
<div class="page" id="page" style="display:none">
  <div class="page-head">
    <h1>AI 日志</h1>
    <p>查看 AI 请求记录、Token 用量、响应时间</p>
  </div>

  <div id="notice"></div>

  <!-- 统计概览 -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总请求数</div></div>
    <div class="stat-card"><div class="stat-num" id="statSuccess">0</div><div class="stat-label">成功</div></div>
    <div class="stat-card"><div class="stat-num" id="statFailed">0</div><div class="stat-label">失败</div></div>
    <div class="stat-card"><div class="stat-num" id="statAvgDuration">0ms</div><div class="stat-label">平均耗时</div></div>
  </div>

  <!-- 筛选 -->
  <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center">
    <input type="text" id="searchInput" placeholder="搜索 Request ID / 用户 / 模型..." style="padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:var(--bg-input);color:var(--text);flex:1">
    <select id="statusFilter" style="padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:var(--bg-input);color:var(--text)">
      <option value="all">全部状态</option>
      <option value="success">成功</option>
      <option value="failed">失败</option>
    </select>
    <button class="btn btn-primary" onclick="loadLogs()">搜索</button>
  </div>

  <!-- 日志表格 -->
  <div style="overflow-x:auto">
    <table class="log-table">
      <thead>
        <tr>
          <th>Request ID</th>
          <th>用户</th>
          <th>时间</th>
          <th>模型</th>
          <th>Prompt Token</th>
          <th>Completion Token</th>
          <th>耗时(ms)</th>
          <th>状态</th>
          <th>错误</th>
        </tr>
      </thead>
      <tbody id="logList"></tbody>
    </table>
  </div>
  <div id="pagination" style="margin-top:16px;display:flex;gap:8px;align-items:center"></div>
</div>

<script src="/js/app.js"></script>
<script>
if (App.guard()) {
  App.renderHeader('admin');
  document.getElementById('page').style.display = 'block';

  let currentPage = 0;
  const pageSize = 50;

  function showNotice(msg, type) {
    const el = document.getElementById('notice');
    el.innerHTML = `<div class="notice ${type}">${msg}</div>`;
    setTimeout(() => el.innerHTML = '', 3000);
  }

  function loadStats() {
    App.api('/api/admin/ai-logs/stats').then(d => {
      const s = d.stats;
      document.getElementById('statTotal').textContent = s.total;
      document.getElementById('statSuccess').textContent = s.success;
      document.getElementById('statFailed').textContent = s.failed;
      document.getElementById('statAvgDuration').textContent = s.avgDuration + 'ms';
    }).catch(() => {});
  }

  function loadLogs() {
    const search = document.getElementById('searchInput').value.trim();
    const status = document.getElementById('statusFilter').value;
    const offset = currentPage * pageSize;

    App.api(`/api/admin/ai-logs?limit=${pageSize}&offset=${offset}`).then(d => {
      const logs = d.logs || [];
      const total = d.total || 0;
      const tbody = document.getElementById('logList');

      let filtered = logs;
      if (search) {
        filtered = filtered.filter(l =>
          (l.requestId || '').includes(search) ||
          (l.userName || '').includes(search) ||
          (l.model || '').includes(search)
        );
      }
      if (status !== 'all') {
        filtered = filtered.filter(l => l.status === status);
      }

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-dim)">暂无日志记录</td></tr>';
      } else {
        tbody.innerHTML = filtered.map(l => `
          <tr>
            <td class="mono" style="font-size:11px">${App.esc(l.requestId || '-')}</td>
            <td>${App.esc(l.userName || '-')}</td>
            <td style="font-size:11px">${l.timestamp ? l.timestamp.replace('T',' ').slice(0,19) : '-'}</td>
            <td>${App.esc(l.model || '-')}</td>
            <td class="mono">${l.promptTokens || 0}</td>
            <td class="mono">${l.completionTokens || 0}</td>
            <td class="mono">${l.duration || 0}</td>
            <td><span class="badge ${l.status === 'success' ? 'badge-success' : 'badge-danger'}">${l.status || '-'}</span></td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--danger)">${l.error ? App.esc(l.error) : '-'}</td>
          </tr>
        `).join('');
      }

      // 分页
      const totalPages = Math.ceil(total / pageSize);
      const pg = document.getElementById('pagination');
      pg.innerHTML = '';
      if (totalPages > 1) {
        pg.innerHTML = `<span style="color:var(--text-dim);font-size:12px">共 ${total} 条</span>`;
        for (let i = 0; i < totalPages && i < 10; i++) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-sm' + (i === currentPage ? ' on' : '');
          btn.textContent = i + 1;
          btn.onclick = () => { currentPage = i; loadLogs(); };
          pg.appendChild(btn);
        }
      }
    }).catch(() => {
      document.getElementById('logList').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-dim)">加载失败</td></tr>';
    });
  }

  loadStats();
  loadLogs();
}
</script>
</body>
</html>
