<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><title>用户管理</title>
<link rel="stylesheet" href="css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="css/custom-theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sidebar.css">
<style>
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th, .tbl td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .tbl th { background: var(--bg-panel-2); font-weight: 500; color: var(--text-dim); font-size: 12px; }
  .tbl tr:hover td { background: var(--bg-panel-2); }
  .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; }
  .modal.active { display: flex; }
  .modal-content { background: var(--bg-panel); padding: 24px; border-radius: 8px; width: 90%; max-width: 560px; border: 1px solid var(--border); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--text-dim); }
  .form-group input, .form-group select { width: 100%; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .role-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; background:rgba(102,126,234,0.2); color:#7cb2ff; }
  .readonly-tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; background:rgba(255,152,0,0.2); color:#ff9800; margin-left:6px; }
</style>
</head>
<body>
<div class="page" id="page" style="display:none">
  <div class="page-head">
    <h1>用户管理</h1>
    <p>创建用户、管理权限、查看角色与业务�?/p>
  </div>

  <div id="notice"></div>

  <div style="margin-bottom:16px">
    <button class="btn btn-primary" onclick="openAddModal()">+ 新增用户</button>
  </div>

  <div style="overflow-x:auto">
    <table class="tbl">
      <thead>
        <tr>
          <th>用户�?/th>
          <th>姓名</th>
          <th>角色</th>
          <th>业务�?/th>
          <th>部门</th>
          <th>状�?/th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="userList"></tbody>
    </table>
  </div>
</div>

<!-- 新增/编辑用户弹窗 -->
<div class="modal" id="userModal">
  <div class="modal-content">
    <h3 id="modalTitle">新增用户</h3>
    <form id="userForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label>用户�?*</label>
          <input type="text" id="u_username" placeholder="e.g. zhangsan">
        </div>
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="u_name" placeholder="e.g. 张三">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="u_password" placeholder="初始密码">
        </div>
        <div class="form-group">
          <label>角色 *</label>
          <select id="u_role">
            <option value="admin">系统管理�?/option>
            <option value="reviewer">审核专员</option>
            <option value="product">产品经理</option>
            <option value="test">测试工程�?/option>
            <option value="frontend">前端工程�?/option>
            <option value="cs">客服专员</option>
            <option value="guest">演示访客</option>
          </select>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label>业务�?/label>
          <select id="u_bizline">
            <option value="all">全业务线</option>
            <option value="trade">交易�?/option>
            <option value="membership">会员�?/option>
          </select>
        </div>
        <div class="form-group">
          <label>部门</label>
          <input type="text" id="u_department" placeholder="如：产品�?>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 编辑用户弹窗（管理权�?重置密码�?-->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>编辑权限</h3>
    <form id="editForm">
      <input type="hidden" id="edit_id">
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="e_name">
      </div>
      <div class="form-group">
        <label>角色</label>
        <select id="e_role">
          <option value="admin">系统管理�?/option>
          <option value="reviewer">审核专员</option>
          <option value="product">产品经理</option>
          <option value="test">测试工程�?/option>
          <option value="frontend">前端工程�?/option>
          <option value="cs">客服专员</option>
          <option value="guest">演示访客</option>
        </select>
      </div>
      <div class="form-group">
        <label>业务�?/label>
        <select id="e_bizline">
          <option value="all">全业务线</option>
          <option value="trade">交易�?/option>
          <option value="membership">会员�?/option>
        </select>
      </div>
      <div class="form-group">
        <label>部门</label>
        <input type="text" id="e_department">
      </div>
      <div class="form-group">
        <label>重置密码（留空则不修改）</label>
        <input type="password" id="e_password" placeholder="新密�?>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script>
if (App.guard()) {
  App.renderSidebar('admin', 'users');
  document.getElementById('page').style.display = 'block';

  const ROLE_LABELS = { admin:'系统管理�?, reviewer:'审核专员', product:'产品经理', test:'测试工程�?, frontend:'前端工程�?, cs:'客服专员', guest:'演示访客' };

  function showNotice(msg, type) {
    const el = document.getElementById('notice');
    el.innerHTML = `<div class="notice ${type}">${msg}</div>`;
    setTimeout(() => el.innerHTML = '', 3000);
  }

  function loadUsers() {
    App.api('/api/admin/users').then(d => {
      const users = d.users || [];
      const tbody = document.getElementById('userList');
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-dim)">暂无用户</td></tr>';
        return;
      }
      tbody.innerHTML = users.map(u => `
        <tr>
          <td class="mono">${App.esc(u.username)}</td>
          <td>${App.esc(u.name)}${u.readonly ? '<span class="readonly-tag">只读</span>' : ''}</td>
          <td><span class="role-badge">${ROLE_LABELS[u.role] || u.role}</span></td>
          <td>${u.bizLineLabel || u.bizLine}</td>
          <td>${App.esc(u.department || '-')}</td>
          <td style="color:var(--success)">启用</td>
          <td>
            <button class="btn btn-sm" onclick="openEditModal('${u.id}')">编辑权限</button>
            <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}','${u.username}')">删除</button>
          </td>
        </tr>
      `).join('');
    }).catch(() => {
      document.getElementById('userList').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-dim)">加载失败</td></tr>';
    });
  }

  function openAddModal() {
    document.getElementById('modalTitle').textContent = '新增用户';
    document.getElementById('userForm').reset();
    document.getElementById('userModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('userModal').classList.remove('active');
  }

  function openEditModal(id) {
    App.api('/api/admin/users').then(d => {
      const u = (d.users || []).find(x => x.id === id);
      if (!u) { showNotice('用户不存�?, 'error'); return; }
      document.getElementById('edit_id').value = u.id;
      document.getElementById('e_name').value = u.name || '';
      document.getElementById('e_role').value = u.role || '';
      document.getElementById('e_bizline').value = u.bizLine || 'all';
      document.getElementById('e_department').value = u.department || '';
      document.getElementById('e_password').value = '';
      document.getElementById('editModal').classList.add('active');
    }).catch(err => showNotice('加载失败: ' + err.message, 'error'));
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
  }

  async function deleteUser(id, username) {
    if (!(await App.confirm(`确认删除用户�?{username}」？`))) return;
    App.api('/api/admin/users/' + id, { method: 'DELETE' }).then(() => {
      showNotice('用户已删�?);
      loadUsers();
    }).catch(err => showNotice('删除失败: ' + err.message, 'error'));
  }

  document.getElementById('userForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const data = {
      username: document.getElementById('u_username').value.trim(),
      password: document.getElementById('u_password').value,
      name: document.getElementById('u_name').value.trim(),
      role: document.getElementById('u_role').value,
      bizLine: document.getElementById('u_bizline').value,
      department: document.getElementById('u_department').value.trim(),
    };
    if (!data.username || !data.password || !data.name) {
      showNotice('用户名、密码、姓名为必填�?, 'error');
      return;
    }
    App.api('/api/admin/users', { method: 'POST', body: data }).then(() => {
      showNotice('用户已创�?);
      closeModal();
      loadUsers();
    }).catch(err => showNotice('创建失败: ' + err.message, 'error'));
  });

  document.getElementById('editForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('edit_id').value;
    const data = {
      name: document.getElementById('e_name').value.trim(),
      role: document.getElementById('e_role').value,
      bizLine: document.getElementById('e_bizline').value,
      department: document.getElementById('e_department').value.trim(),
    };
    const pwd = document.getElementById('e_password').value;
    if (pwd) data.password = pwd;
    App.api('/api/admin/users/' + id, { method: 'PUT', body: data }).then(() => {
      showNotice('权限已更�?);
      closeEditModal();
      loadUsers();
    }).catch(err => showNotice('更新失败: ' + err.message, 'error'));
  });

  loadUsers();
}
</script>
</body>
</html>
