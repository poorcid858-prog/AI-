<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服管理后台</title>
<link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/css/custom-theme.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); }
  .page { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; }
  .page-head p { color: var(--text-dim); font-size: 13px; }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab-btn { padding: 10px 20px; border: none; background: none; cursor: pointer; font-size: 14px; color: var(--text-dim); border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-title { font-size: 16px; font-weight: 600; }

  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th, .tbl td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  .tbl th { background: var(--bg-panel-2); font-weight: 500; color: var(--text-dim); font-size: 12px; }
  .tbl tr:hover td { background: var(--bg-panel-2); }

  .modal { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; }
  .modal.active { display: flex; }
  .modal-content { background: var(--bg-panel); padding: 24px; border-radius: 8px; width: 90%; max-width: 500px; border: 1px solid var(--border); }
  .modal-header { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 13px; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .metric-card { padding: 16px; border-radius: 8px; background: var(--bg-panel-2); border: 1px solid var(--border); }
  .metric-num { font-size: 24px; font-weight: 700; }
  .metric-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .metric-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { opacity: 0.9; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-secondary { background: var(--border); color: var(--text); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .badge-success { background: rgba(76, 175, 80, 0.2); color: var(--success); }
  .badge-warning { background: rgba(255, 152, 0, 0.2); color: var(--warning); }
  .badge-danger { background: rgba(244, 67, 54, 0.2); color: var(--danger); }
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <h1>⚙️ 客服管理后台</h1>
    <p>话术库管理、同义词表、未命中问题池、效果指标看板</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="metrics">效果指标</button>
    <button class="tab-btn" data-tab="phrases">话术库</button>
    <button class="tab-btn" data-tab="synonyms">同义词表</button>
    <button class="tab-btn" data-tab="unmatch">未命中池</button>
  </div>

  <!-- 效果指标 -->
  <div class="tab-content active" id="metrics-tab">
    <div class="metrics-grid" id="metricsGrid">
      <div class="metric-card"><div class="metric-num" id="m_hitRate">0%</div><div class="metric-label">命中率</div><div class="metric-sub" id="m_hitCount">0 次命中</div></div>
      <div class="metric-card"><div class="metric-num" id="m_fallbackRate">0%</div><div class="metric-label">兜底率</div><div class="metric-sub" id="m_fallbackCount">0 次兜底</div></div>
      <div class="metric-card"><div class="metric-num" id="m_transferRate">0%</div><div class="metric-label">转人工率</div><div class="metric-sub" id="m_unmatchedCount">0 次未命中</div></div>
      <div class="metric-card"><div class="metric-num" id="m_avgHits">0</div><div class="metric-label">平均命中关键字数</div><div class="metric-sub" id="m_totalRequests">总请求: 0</div></div>
    </div>
  </div>

  <!-- 话术库 -->
  <div class="tab-content" id="phrases-tab">
    <div class="section-header">
      <h2 class="section-title">话术库管理</h2>
      <button class="btn btn-primary" id="addPhraseBtn">+ 新增话术</button>
    </div>
    <table class="tbl">
      <thead><tr><th>关键词</th><th>回复内容</th><th>优先级</th><th>操作</th></tr></thead>
      <tbody id="phrasesList"></tbody>
    </table>
  </div>

  <!-- 同义词表 -->
  <div class="tab-content" id="synonyms-tab">
    <div class="section-header">
      <h2 class="section-title">同义词管理</h2>
      <button class="btn btn-primary" id="addSynonymBtn">+ 新增同义词</button>
    </div>
    <table class="tbl">
      <thead><tr><th>标准词</th><th>同义词</th><th>操作</th></tr></thead>
      <tbody id="synonymsList"></tbody>
    </table>
  </div>

  <!-- 未命中池 -->
  <div class="tab-content" id="unmatch-tab">
    <div class="section-header">
      <h2 class="section-title">未命中问题池</h2>
      <div>
        <button class="btn btn-sm btn-danger" id="clearUnmatchBtn">清空全部</button>
      </div>
    </div>
    <table class="tbl">
      <thead><tr><th>问题</th><th>时间</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="unmatchList"></tbody>
    </table>
  </div>
</div>

<!-- 话术模态框 -->
<div class="modal" id="phraseModal">
  <div class="modal-content">
    <div class="modal-header" id="phraseModalTitle">新增话术</div>
    <form id="phraseForm">
      <div class="form-group">
        <label>关键词 *</label>
        <input type="text" id="p_keyword" placeholder="e.g. 退款" required>
      </div>
      <div class="form-group">
        <label>回复内容 *</label>
        <textarea id="p_reply" placeholder="输入回复内容..." required></textarea>
      </div>
      <div class="form-group">
        <label>优先级 (1-10，越小越高)</label>
        <input type="number" id="p_priority" min="1" max="10" value="1">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closePhraseModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 同义词模态框 -->
<div class="modal" id="synonymModal">
  <div class="modal-content">
    <div class="modal-header" id="synonymModalTitle">新增同义词</div>
    <form id="synonymForm">
      <div class="form-group">
        <label>标准词 *</label>
        <input type="text" id="s_keyword" placeholder="e.g. 退货" required>
      </div>
      <div class="form-group">
        <label>同义词（用逗号分隔）</label>
        <textarea id="s_variants" placeholder="e.g. 不想要,能不能退,寄回去" required></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeSynonymModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="/js/vendor/sweetalert2.all.min.js"></script>
<script src="/js/vendor/dompurify.min.js"></script>
<script src="/js/app.js"></script>
<script>
// ============ 标签页切换 ============
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
    loadTab(btn.dataset.tab);
  });
});

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2600);
}

function loadTab(tab) {
  if (tab === 'metrics') loadMetrics();
  else if (tab === 'phrases') loadPhrases();
  else if (tab === 'synonyms') loadSynonyms();
  else if (tab === 'unmatch') loadUnmatch();
}

// ============ 效果指标 ============
function loadMetrics() {
  fetch('/api/service-admin/metrics', {
    headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }
  }).then(r => r.json()).then(d => {
    if (!d.ok) return;
    const m = d.data;
    document.getElementById('m_hitRate').textContent = m.hitRate + '%';
    document.getElementById('m_hitCount').textContent = m.hitCount + ' 次命中';
    document.getElementById('m_fallbackRate').textContent = m.fallbackRate + '%';
    document.getElementById('m_fallbackCount').textContent = m.fallbackCount + ' 次兜底';
    document.getElementById('m_transferRate').textContent = m.transferRate + '%';
    document.getElementById('m_unmatchedCount').textContent = m.unmatchedCount + ' 次未命中';
    document.getElementById('m_avgHits').textContent = m.avgKeywordHits || 0;
    document.getElementById('m_totalRequests').textContent = '总请求: ' + m.totalRequests;
  }).catch(() => {});
}

// ============ 话术库 ============
let editingPhraseId = null;

function loadPhrases() {
  fetch('/api/service-admin/phrases?limit=100', {
    headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }
  }).then(r => r.json()).then(d => {
    const list = document.getElementById('phrasesList');
    if (!d.ok || !d.data || d.data.length === 0) {
      list.innerHTML = '<tr><td colspan="4" class="empty-state">暂无话术</td></tr>';
      return;
    }
    list.innerHTML = d.data.map(p => `
      <tr>
        <td><strong>${App.esc(p.keyword)}</strong></td>
        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis">${App.esc(p.reply)}</td>
        <td>${p.priority}</td>
        <td>
          <button class="btn btn-sm" onclick="editPhrase('${p.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="deletePhrase('${p.id}')">删除</button>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    document.getElementById('phrasesList').innerHTML = '<tr><td colspan="4" class="empty-state">加载失败</td></tr>';
  });
}

function openPhraseModal() { document.getElementById('phraseModal').classList.add('active'); }
function closePhraseModal() {
  document.getElementById('phraseModal').classList.remove('active');
  document.getElementById('phraseForm').reset();
  document.getElementById('p_priority').value = '1';
  editingPhraseId = null;
  document.getElementById('phraseModalTitle').textContent = '新增话术';
}

function editPhrase(id) {
  fetch('/api/service-admin/phrases?limit=200', {
    headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }
  }).then(r => r.json()).then(d => {
    const p = (d.data || []).find(x => x.id === id);
    if (!p) { toast('话术不存在', 'error'); return; }
    editingPhraseId = p.id;
    document.getElementById('phraseModalTitle').textContent = '编辑话术';
    document.getElementById('p_keyword').value = p.keyword || '';
    document.getElementById('p_reply').value = p.reply || '';
    document.getElementById('p_priority').value = p.priority || 1;
    openPhraseModal();
  }).catch(() => toast('加载失败', 'error'));
}

async function deletePhrase(id) {
  const ok = await App.confirm('确认删除此话术？');
  if (!ok) return;
  try {
    const res = await fetch('/api/service-admin/phrases/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') } });
    const d = await res.json();
    if (d.ok) { toast('已删除'); loadPhrases(); }
    else toast(d.error, 'error');
  } catch(e) { toast('删除失败', 'error'); }
}

document.getElementById('addPhraseBtn').addEventListener('click', () => {
  editingPhraseId = null;
  document.getElementById('phraseModalTitle').textContent = '新增话术';
  document.getElementById('phraseForm').reset();
  document.getElementById('p_priority').value = '1';
  openPhraseModal();
});

document.getElementById('phraseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = {
    keyword: document.getElementById('p_keyword').value,
    reply: document.getElementById('p_reply').value,
    priority: parseInt(document.getElementById('p_priority').value) || 1,
  };
  const url = editingPhraseId ? '/api/service-admin/phrases/' + editingPhraseId : '/api/service-admin/phrases';
  const method = editingPhraseId ? 'PUT' : 'POST';
  try {
    const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }, body: JSON.stringify(data) });
    const d = await res.json();
    if (d.ok) { toast(editingPhraseId ? '已更新' : '已新增'); closePhraseModal(); loadPhrases(); }
    else toast(d.error, 'error');
  } catch(e) { toast('操作失败', 'error'); }
});

// ============ 同义词表 ============
let editingSynonymId = null;

function loadSynonyms() {
  fetch('/api/service-admin/synonyms', {
    headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }
  }).then(r => r.json()).then(d => {
    const list = document.getElementById('synonymsList');
    if (!d.ok || !d.data || d.data.length === 0) {
      list.innerHTML = '<tr><td colspan="3" class="empty-state">暂无同义词</td></tr>';
      return;
    }
    list.innerHTML = d.data.map(s => `
      <tr>
        <td><strong>${App.esc(s.keyword)}</strong></td>
        <td>${App.esc((s.variants || []).join(', '))}</td>
        <td>
          <button class="btn btn-sm" onclick="editSynonym('${s.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="deleteSynonym('${s.keyword}')">删除</button>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    document.getElementById('synonymsList').innerHTML = '<tr><td colspan="3" class="empty-state">加载失败</td></tr>';
  });
}

function openSynonymModal() { document.getElementById('synonymModal').classList.add('active'); }
function closeSynonymModal() {
  document.getElementById('synonymModal').classList.remove('active');
  document.getElementById('synonymForm').reset();
  editingSynonymId = null;
  document.getElementById('synonymModalTitle').textContent = '新增同义词';
}

function editSynonym(id) {
  fetch('/api/service-admin/synonyms', {
    headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }
  }).then(r => r.json()).then(d => {
    const s = (d.data || []).find(x => x.id === id);
    if (!s) { toast('同义词不存在', 'error'); return; }
    editingSynonymId = s.id;
    document.getElementById('synonymModalTitle').textContent = '编辑同义词';
    document.getElementById('s_keyword').value = s.keyword || '';
    document.getElementById('s_variants').value = (s.variants || []).join(', ');
    openSynonymModal();
  }).catch(() => toast('加载失败', 'error'));
}

async function deleteSynonym(keyword) {
  const ok = await App.confirm('确认删除此同义词？');
  if (!ok) return;
  try {
    const res = await fetch('/api/service-admin/synonyms/' + encodeURIComponent(keyword), { method: 'DELETE', headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') } });
    const d = await res.json();
    if (d.ok) { toast('已删除'); loadSynonyms(); }
    else toast(d.error, 'error');
  } catch(e) { toast('删除失败', 'error'); }
}

document.getElementById('addSynonymBtn').addEventListener('click', () => {
  editingSynonymId = null;
  document.getElementById('synonymModalTitle').textContent = '新增同义词';
  document.getElementById('synonymForm').reset();
  openSynonymModal();
});

document.getElementById('synonymForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const keyword = document.getElementById('s_keyword').value;
  const variants = document.getElementById('s_variants').value.split(',').map(v => v.trim()).filter(v => v);
  const data = { keyword, variants };
  const url = editingSynonymId ? '/api/service-admin/synonyms/' + editingSynonymId : '/api/service-admin/synonyms';
  const method = editingSynonymId ? 'PUT' : 'POST';
  try {
    const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }, body: JSON.stringify(data) });
    const d = await res.json();
    if (d.ok) { toast(editingSynonymId ? '已更新' : '已新增'); closeSynonymModal(); loadSynonyms(); }
    else toast(d.error, 'error');
  } catch(e) { toast('操作失败', 'error'); }
});

// ============ 未命中池 ============
function loadUnmatch() {
  fetch('/api/service-admin/unmatched', {
    headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }
  }).then(r => r.json()).then(d => {
    const list = document.getElementById('unmatchList');
    if (!d.ok || !d.data || d.data.length === 0) {
      list.innerHTML = '<tr><td colspan="4" class="empty-state">暂无未命中问题</td></tr>';
      return;
    }
    list.innerHTML = d.data.map(u => `
      <tr>
        <td style="max-width:400px;overflow:hidden;text-overflow:ellipsis">${App.esc(u.question)}</td>
        <td style="font-size:11px">${u.timestamp ? u.timestamp.replace('T',' ').slice(0,19) : '-'}</td>
        <td><span class="badge badge-warning">${u.status === 'pending' ? '待处理' : u.status}</span></td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="deleteUnmatch('${u.id}')">删除</button>
        </td>
      </tr>
    `).join('');
  }).catch(() => {
    document.getElementById('unmatchList').innerHTML = '<tr><td colspan="4" class="empty-state">加载失败</td></tr>';
  });
}

async function deleteUnmatch(id) {
  try {
    const res = await fetch('/api/service-admin/unmatched/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') } });
    const d = await res.json();
    if (d.ok) { toast('已删除'); loadUnmatch(); }
  } catch(e) { toast('删除失败', 'error'); }
}

document.getElementById('clearUnmatchBtn').addEventListener('click', async () => {
  const ok = await App.confirm('确认清空全部未命中问题？');
  if (!ok) return;
  try {
    const res = await fetch('/api/service-admin/unmatched', { method: 'DELETE', headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') } });
    const d = await res.json();
    if (d.ok) { toast('已清空'); loadUnmatch(); }
  } catch(e) { toast('清空失败', 'error'); }
});

// 初始化
loadMetrics();
</script>
</body>
</html>
